name: Timetric
description: Timetric was a London-based data platform founded in 2008 for publishing,
  analysing, and performing calculations on large quantities of time-varying statistical
  data, later providing online market data, analysis, and advisory services to the
  insurance, construction, and infrastructure sectors. The Timetric Platform exposed
  an API with OAuth and API-token authentication for creating and updating time
  series. Timetric was acquired by GlobalData in March 2018 and timetric.com now
  redirects to globaldata.com; the company no longer operates independently.
